[project]
name = "eyes-on-karhutla"
version = "0.1.0"
description = "Harmonized MODIS–VIIRS burning activity calendar for Indonesian forest and land fires (NASA Space Apps 2026)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "geopandas>=1.0",
    "shapely>=2.0",
    "streamlit>=1.40",
    "plotly>=5.24",
    "folium>=0.18",
    "streamlit-folium>=0.23",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jupyterlab>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eyes_on_karhutla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
